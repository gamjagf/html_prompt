<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML 바이브코딩 프로젝트 프롬프트 모음</title>

<!-- 카카오톡 공유 미리보기용 -->
<meta property="og:title" content="HTML 바이브코딩 프로젝트 프롬프트 모음">
<meta property="og:description" content="꽃님이 AI 연구소 · 한방도라지 화장품 광고 · 나만의 꿈나라 홈페이지">
<meta property="og:image" content="project_thumbnail.png">
<meta property="og:type" content="website">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #101814;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.page {
  width: 100%;
  max-width: 430px;
  position: relative;
  background: #000;
}

.thumbnail {
  width: 100%;
  display: block;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

/*
  업로드한 9:16 대표 이미지 속 3개 '바로가기' 버튼 위에
  투명 클릭 영역을 올린 방식입니다.
*/
.hotspot {
  position: absolute;
  left: 4%;
  width: 43%;
  height: 7.5%;
  border-radius: 999px;
  text-decoration: none;
  background: rgba(255,255,255,0);
  -webkit-tap-highlight-color: rgba(255,255,255,0.18);
}

.hotspot:focus {
  outline: 3px solid rgba(255,255,255,0.85);
  outline-offset: 3px;
}

.ai-link {
  top: 25.6%;
}

.doraji-link {
  top: 59.2%;
}

.dream-link {
  top: 91.3%;
}

@media (min-width: 431px) {
  .page {
    margin: 18px auto;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 42px rgba(0,0,0,0.32);
  }
}
</style>
</head>

<body>
  <main class="page">
    <img src="project_thumbnail.png" alt="HTML 바이브코딩 프로젝트 프롬프트 모음 대표 이미지" class="thumbnail">

    <a class="hotspot ai-link" href="project_ai_lab.html" aria-label="꽃님이 AI 연구소 프로젝트 바로가기">
      <span class="sr-only">꽃님이 AI 연구소 프로젝트 바로가기</span>
    </a>

    <a class="hotspot doraji-link" href="project_doraji_cosmetic.html" aria-label="한방도라지 화장품 광고 프로젝트 바로가기">
      <span class="sr-only">한방도라지 화장품 광고 프로젝트 바로가기</span>
    </a>

    <a class="hotspot dream-link" href="project_dream_homepage.html" aria-label="나만의 꿈나라 홈페이지 프로젝트 바로가기">
      <span class="sr-only">나만의 꿈나라 홈페이지 프로젝트 바로가기</span>
    </a>
  </main>
</body>
</html>
